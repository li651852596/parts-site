<h1>SEARCH PRODUCTS &amp; PAGES</h1>
<form onsubmit="doSearch(event);return false">
<input id="kw" placeholder="Enter product name, e.g. AIR FILTER" />
<button id="go" type="submit">SEARCH</button>
</form>
<div class="count" id="count"></div>
<div id="result"></div>
<script src="/search-index.js"></script>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function doSearch(){
  var q=document.getElementById('kw').value.trim().toLowerCase();
  var idx=window.__SEARCH_INDEX__||[];
  var hits=[];
  if(q){
    hits=idx.filter(function(it){
      var hay=(it.title+' '+it.kw.join(' ')).toLowerCase();
      return hay.indexOf(q)>=0;
    });
  }
  var out='';
  hits.forEach(function(it){
    var desc=it.kw.slice(0,4).join(' · ');
    out+='<div class="r"><a href="'+esc(it.url)+'">'+esc(it.title)+'</a><p>'+esc(desc)+'</p></div>';
  });
  document.getElementById('result').innerHTML=out|| (q?'<p>No results found.</p>':'');
  document.getElementById('count').textContent=q?('Result: '+hits.length):'';
}
var m=location.search.match(/keyword=([^&]*)/);
if(m){document.getElementById('kw').value=decodeURIComponent(m[1]);doSearch();}
</script></body></html>
